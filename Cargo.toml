[workspace]
resolver = "3"
members = [
  'apps/desktop',
  'crates/core',
  'crates/editor-model',
  'crates/ae-expressions',
  'crates/ae-project',
  'crates/spatial',
  'crates/temporal-scalar',
  'crates/audio-spectrum',
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"

[patch.crates-io]
# GPUI pins Taffy 0.9, which still requires grid 0.18. Keep its API while
# backporting the upstream overflow fix; see vendor/grid/README.libreeffects.md.
grid = { path = "vendor/grid" }

# Preserve authoritative shaping clusters and all glyph paint formats for Text Animator.
usvg = { path = "vendor/usvg" }

# Checked, bounded Repeat Edge Pixels Gaussian rendering.
resvg = { path = "vendor/resvg" }

# Pinned GPUI: negotiate reliable X11 repeat releases on the existing client.
gpui = { path = "vendor/gpui" }

# Keep the embedded C VM optimized in development and test builds. Expressions
# retain the same CPU deadline as release builds; unoptimized VM dispatch must
# not consume that deadline merely because the owning Rust app is being debugged.
[profile.dev.package.rquickjs-sys]
opt-level = 2

[profile.test.package.rquickjs-sys]
opt-level = 2

# Keep software rasterization usable while debugging the editor. Large blur,
# matte and image passes otherwise spend seconds in per-pixel dependency loops.
# Editor code and debug assertions remain unchanged; no fast-math is enabled.
[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.test.package.resvg]
opt-level = 2

[profile.test.package.tiny-skia]
opt-level = 2
