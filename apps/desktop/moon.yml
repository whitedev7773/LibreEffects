$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'application'

tasks:
  dev:
    command: 'cargo run'
    options:
      runInCI: false

  check:
    command:
      - 'cargo'
      - '--config'
      - 'profile.dev.package.libre-effects-desktop.debug=0'
      - 'check'
      - '--workspace'
      - '--all-targets'
      - '--locked'
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_support.rs'
      - 'tests/**/*'
      - 'fixtures/**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/crates/editor-model/src/**/*'
      - '/crates/ae-expressions/src/**/*'
      - '/crates/ae-project/src/**/*'
      - '/crates/spatial/Cargo.toml'
      - '/crates/spatial/src/**/*'
      - '/crates/temporal-scalar/Cargo.toml'
      - '/crates/temporal-scalar/src/**/*'
      - '/crates/audio-spectrum/Cargo.toml'
      - '/crates/audio-spectrum/src/**/*'
      - '/crates/ae-project/tests/**/*'
      - '/crates/ae-project/examples/**/*'
      - '/crates/ae-expressions/examples/**/*'
      - '/crates/editor-model/examples/**/*'
      - '/crates/editor-model/Cargo.toml'
      - '/crates/ae-expressions/Cargo.toml'
      - '/crates/ae-project/Cargo.toml'
      - 'scripts/**/*'
      - '/.prototools'
      - '/examples/**/*'
      - '/crates/core/tests/**/*'
      - '/crates/core/examples/**/*'
      - '/crates/core/Cargo.toml'
      - '/vendor/grid/Cargo.toml'
      - '/vendor/grid/src/**/*'
      - '/vendor/usvg/Cargo.toml'
      - '/vendor/usvg/src/**/*'
      - '/vendor/resvg/Cargo.toml'
      - '/vendor/resvg/src/**/*'
      - '/vendor/gpui/Cargo.toml'
      - '/vendor/gpui/build.rs'
      - '/vendor/gpui/src/**/*'
      - '/vendor/gpui/resources/**/*'

  test:
    command:
      - 'cargo'
      - '--config'
      - 'profile.test.package.libre-effects-desktop.debug=0'
      - '--config'
      - 'profile.test.package.libre-effects-desktop.strip="debuginfo"'
      - '--config'
      - 'profile.test.package.libre-effects-desktop.codegen-units=16'
      - 'test'
      - '--workspace'
      - '--locked'
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_support.rs'
      - 'tests/**/*'
      - 'fixtures/**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/crates/editor-model/src/**/*'
      - '/crates/ae-expressions/src/**/*'
      - '/crates/ae-project/src/**/*'
      - '/crates/spatial/Cargo.toml'
      - '/crates/spatial/src/**/*'
      - '/crates/temporal-scalar/Cargo.toml'
      - '/crates/temporal-scalar/src/**/*'
      - '/crates/audio-spectrum/Cargo.toml'
      - '/crates/audio-spectrum/src/**/*'
      - '/crates/ae-project/tests/**/*'
      - '/crates/ae-project/examples/**/*'
      - '/crates/ae-expressions/examples/**/*'
      - '/crates/editor-model/examples/**/*'
      - '/crates/editor-model/Cargo.toml'
      - '/crates/ae-expressions/Cargo.toml'
      - '/crates/ae-project/Cargo.toml'
      - 'scripts/**/*'
      - '/.prototools'
      - '/crates/core/Cargo.toml'
      - '/crates/core/tests/**/*'
      - '/crates/core/examples/**/*'
      - '/examples/**/*'
      - '/vendor/grid/Cargo.toml'
      - '/vendor/grid/src/**/*'
      - '/vendor/usvg/Cargo.toml'
      - '/vendor/usvg/src/**/*'
      - '/vendor/resvg/Cargo.toml'
      - '/vendor/resvg/src/**/*'
      - '/vendor/gpui/Cargo.toml'
      - '/vendor/gpui/build.rs'
      - '/vendor/gpui/src/**/*'
      - '/vendor/gpui/resources/**/*'

  test-models:
    command:
      - 'cargo'
      - 'test'
      - '-p'
      - 'libre-effects-editor-model'
      - '--locked'
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    inputs:
      - '/crates/core/src/**/*'
      - '/crates/core/Cargo.toml'
      - '/crates/editor-model/src/**/*'
      - '/crates/ae-expressions/src/**/*'
      - '/crates/ae-project/src/**/*'
      - '/crates/spatial/Cargo.toml'
      - '/crates/spatial/src/**/*'
      - '/crates/temporal-scalar/Cargo.toml'
      - '/crates/temporal-scalar/src/**/*'
      - '/crates/audio-spectrum/Cargo.toml'
      - '/crates/audio-spectrum/src/**/*'
      - '/crates/ae-project/tests/**/*'
      - '/crates/ae-project/examples/**/*'
      - '/crates/ae-expressions/examples/**/*'
      - '/crates/editor-model/examples/**/*'
      - '/crates/editor-model/Cargo.toml'
      - '/crates/ae-expressions/Cargo.toml'
      - '/crates/ae-project/Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - 'scripts/**/*'

  test-media:
    command: 'cargo test -p libre-effects-desktop -- --ignored --skip device_clock_minute'
    options:
      runInCI: false
      cache: false

  test-audio-device:
    command: 'cargo test -p libre-effects-desktop device_clock_minute -- --ignored --nocapture'
    options:
      runInCI: false
      cache: false

  format:
    command: 'cargo fmt --all --check'
    inputs:
      - 'src/**/*'
      - 'build.rs'
      - 'build_support.rs'
      - 'tests/**/*'
      - 'fixtures/**/*'
      - '/crates/core/src/**/*'
      - '/crates/editor-model/src/**/*'
      - '/crates/ae-expressions/src/**/*'
      - '/crates/ae-project/src/**/*'
      - '/crates/spatial/Cargo.toml'
      - '/crates/spatial/src/**/*'
      - '/crates/temporal-scalar/Cargo.toml'
      - '/crates/temporal-scalar/src/**/*'
      - '/crates/audio-spectrum/Cargo.toml'
      - '/crates/audio-spectrum/src/**/*'
      - '/crates/ae-project/tests/**/*'
      - '/crates/ae-project/examples/**/*'
      - '/crates/ae-expressions/examples/**/*'
      - '/crates/editor-model/examples/**/*'
      - '/crates/editor-model/Cargo.toml'
      - '/crates/ae-expressions/Cargo.toml'
      - '/crates/ae-project/Cargo.toml'
      - 'scripts/**/*'
      - '/crates/core/examples/**/*'

  build:
    command: 'cargo build --release'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - 'build.rs'
      - 'build_support.rs'
      - 'tests/**/*'
      - 'fixtures/**/*'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/crates/editor-model/src/**/*'
      - '/crates/ae-expressions/src/**/*'
      - '/crates/ae-project/src/**/*'
      - '/crates/spatial/Cargo.toml'
      - '/crates/spatial/src/**/*'
      - '/crates/temporal-scalar/Cargo.toml'
      - '/crates/temporal-scalar/src/**/*'
      - '/crates/audio-spectrum/Cargo.toml'
      - '/crates/audio-spectrum/src/**/*'
      - '/crates/ae-project/tests/**/*'
      - '/crates/ae-project/examples/**/*'
      - '/crates/ae-expressions/examples/**/*'
      - '/crates/editor-model/examples/**/*'
      - '/crates/editor-model/Cargo.toml'
      - '/crates/ae-expressions/Cargo.toml'
      - '/crates/ae-project/Cargo.toml'
      - 'scripts/**/*'
      - '/.prototools'
      - '/examples/**/*'
      - '/crates/core/tests/**/*'
      - '/crates/core/examples/**/*'
      - '/crates/core/Cargo.toml'
      - '/vendor/grid/Cargo.toml'
      - '/vendor/grid/src/**/*'
      - '/vendor/usvg/Cargo.toml'
      - '/vendor/usvg/src/**/*'
      - '/vendor/resvg/Cargo.toml'
      - '/vendor/resvg/src/**/*'
      - '/vendor/gpui/Cargo.toml'
      - '/vendor/gpui/build.rs'
      - '/vendor/gpui/src/**/*'
      - '/vendor/gpui/resources/**/*'
    outputs:
      - '/target/release/libre-effects{,.exe}'
