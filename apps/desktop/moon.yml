$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'application'

tasks:
  dev:
    command: 'cargo run'
    options:
      runInCI: false

  check:
    command: 'cargo check'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/crates/core/Cargo.toml'

  test:
    command: 'cargo test -p libre-effects-desktop'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/examples/**/*'

  test-media:
    command: 'cargo test -p libre-effects-desktop -- --ignored --skip device_clock_minute'
    options:
      runInCI: false
      cache: false

  test-audio-device:
    command: 'cargo test -p libre-effects-desktop device_clock_minute -- --ignored --nocapture'
    options:
      runInCI: false
      cache: false

  format:
    command: 'cargo fmt --all --check'
    inputs:
      - 'src/**/*'
      - '/crates/core/src/**/*'
      - '/crates/core/examples/**/*'

  build:
    command: 'cargo build --release'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/crates/core/src/**/*'
      - '/crates/core/Cargo.toml'
    outputs:
      - '/target/release/libre-effects{,.exe}'
