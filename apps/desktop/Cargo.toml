[package]
name = "libre-effects-desktop"
description = "Libre Effects motion graphics editor, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "libre-effects"
path = "src/main.rs"

[[bin]]
name = "libre-effects-render"
path = "src/render_main.rs"
test = false
bench = false
required-features = ["render-cli"]

[features]
render-cli = []

[dependencies]
libre-effects-ae-expressions = { path = "../../crates/ae-expressions" }
libre-effects-audio-spectrum = { path = "../../crates/audio-spectrum" }
gpui = { workspace = true }
libre-effects-core = { path = "../../crates/core" }
libre-effects-editor-model = { path = "../../crates/editor-model" }
libre-effects-gpu-render = { path = "../../crates/gpu-render" }
tempfile = "3"
anyhow = "1"
resvg = "0.45.1"
# Existing pinned renderer dependencies, also used for strict static SVG preflight.
roxmltree = "=0.20.0"
svgtypes = "=0.15.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
same-file = "1"
sha2 = "0.10.9"
unicode-segmentation = "1.13"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"
unicode-linebreak = "0.1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation"] }
