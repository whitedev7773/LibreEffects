[package]
name = "libre-effects-desktop"
description = "Libre Effects motion graphics editor, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "libre-effects"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
libre-effects-core = { path = "../../crates/core" }
tempfile = "3"
anyhow = "1"
resvg = "0.45.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
serde_json = "1"
