[package]
name = "libre-effects-desktop"
description = "Libre Effects motion graphics editor, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "libre-effects"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
libre-effects-core = { path = "../../crates/core" }
tempfile = "3"
anyhow = "1"
resvg = "0.45.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
same-file = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
