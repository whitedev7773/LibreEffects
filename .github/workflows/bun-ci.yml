name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
          auto-setup: true

      - name: Install web dependencies
        run: bun install --cwd apps/web --frozen-lockfile

      - name: Install API dependencies
        run: bun install --cwd apps/api --frozen-lockfile

      - name: Run CI
        # Desktop validation has its own platform prerequisites and workflow.
        # Keep publishing tasks out of this validation-only pipeline.
        run: moon ci web:build web:test api:build
